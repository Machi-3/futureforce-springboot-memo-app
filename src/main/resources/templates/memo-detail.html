<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>メモ詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    
    <style>
        .badge {
            display: inline-block;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 4px;
            line-height: 1.5;
        }
        .priority-high {
            background-color: #fee2e2;
            color: #ef4444;
        }
        .priority-medium {
            background-color: #fef3c7;
            color: #d97706;
        }
        .priority-low {
            background-color: #dcfce7;
            color: #16a34a;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="app-title">メモ詳細</h1>
            <a th:href="@{/memos}" class="btn btn-outline"><i class="ri-arrow-left-line"></i> 戻る</a>
        </div>
        <div class="note-card note-card-large">
            <div class="note-card-header">
                <h2 class="note-card-title" th:text="${memo.title}">タイトル</h2>
                    <span class="badge"
                          th:if="${memo.priority != null}"
                          th:classappend="${memo.priority.name() == 'HIGH' ? 'priority-high' : (memo.priority.name() == 'MIDDLE' ? 'priority-medium' : 'priority-low')}"
                          th:text="${memo.priority.label}">優先度</span>
                </div>
            </div>
            <div class="note-card-content">
                <p class="note-card-text" th:text="${memo.content}">本文</p>
            </div>

            <div class="note-card-footer detail-footer">
                <div>
                    <p class="note-date" th:text="${#temporals.format(memo.createdAt, 'yyyy/MM/dd HH:mm')}">作成日時</p>
                </div>
                <div class="note-actions">
                    <a th:href="@{|/memos/edit/${memo.id}|}" class="btn btn-primary">編集</a>
                    <a th:href="@{|/memos/delete/${memo.id}|}" class="btn btn-danger">
                        削除
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/common.js}"></script>
</body>

</html>
